server {
    listen 80;
    server_name xavfsizmaktab.uz www.xavfsizmaktab.uz;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xavfsizmaktab.uz www.xavfsizmaktab.uz;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/xavfsizmaktab.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xavfsizmaktab.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Upload size limit
    client_max_body_size 20M;

    # Static files — serve directly from Next.js .next/static
    location /_next/static/ {
        alias /var/www/xavfsizmaktab/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Public static assets
    location /static/ {
        alias /var/www/xavfsizmaktab/public/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Uploaded evidence files
    location /uploads/ {
        alias /var/www/xavfsizmaktab/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next.js application
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
